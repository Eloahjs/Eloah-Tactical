<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Eloah Tactical — Back Soon</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@400;600&family=Barlow:wght@300;400&display=swap" rel="stylesheet" />
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: #0a0b0d;
  color: #c8cfd8;
  font-family: 'Barlow', sans-serif;
  font-weight: 300;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 48px 24px;
}
.logo {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 48px;
  letter-spacing: 8px;
  color: #eef0f3;
  margin-bottom: 4px;
  display: flex;
  align-items: center;
  gap: 4px;
}
.logo-cross {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 32px;
  height: 32px;
  position: relative;
}
.logo-cross::before,
.logo-cross::after {
  content: '';
  position: absolute;
  background: #c8a84b;
}
.logo-cross::before { width: 1px; height: 100%; }
.logo-cross::after { width: 100%; height: 1px; }
.logo-ring {
  position: absolute;
  width: 20px;
  height: 20px;
  border: 1px solid #c8a84b;
  border-radius: 50%;
}
.logo-sub {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 11px;
  letter-spacing: 6px;
  color: #c8a84b;
  text-transform: uppercase;
  margin-bottom: 64px;
}
.divider {
  width: 48px;
  height: 1px;
  background: #c8a84b;
  margin: 0 auto 32px;
}
h1 {
  font-family: 'Bebas Neue', sans-serif;
  font-size: clamp(40px, 6vw, 72px);
  letter-spacing: 2px;
  color: #eef0f3;
  line-height: 1;
  margin-bottom: 24px;
}
h1 span { color: #c8a84b; }
p {
  font-size: 16px;
  line-height: 1.7;
  color: #8a93a3;
  max-width: 480px;
  margin-bottom: 16px;
}
.contact {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 12px;
  letter-spacing: 4px;
  text-transform: uppercase;
  color: #3a4252;
  margin-top: 64px;
}
</style>
</head>
<body>
  <div class="logo">EL<div class="logo-cross"><div class="logo-ring"></div></div>AH</div>
  <div class="logo-sub">Tactical</div>
  <div class="divider"></div>
  <h1>Back <span>Shortly</span></h1>
  <p>We're temporarily offline for updates. We'll be back up soon — thank you for your patience.</p>
  <p>For urgent inquiries contact us at office@eloahtactical.com or 402-937-3881.</p>
  <div class="contact">eloahtactical.com</div>
</body>
</html>
